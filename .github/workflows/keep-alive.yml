name: n8n Keep-Alive Ping

on:
  schedule:
    # 每一小時或每 10 分鐘執行一次 (Cron 語法：每 10 分鐘執行一次)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP GET request to n8n
        run: |
          curl -I https://fly-n8n-honeyed-shoreline-2056.fly.dev/
