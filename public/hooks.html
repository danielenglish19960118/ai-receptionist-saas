<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10,000+ Interactive Hooks | Garfield AI Executive</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050507; color: #F4F4F5; }
        .gold-gradient-text { background: linear-gradient(135deg, #FFF5C0 0%, #D4AF37 45%, #AA771C 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-border-glow { border: 1px solid rgba(212, 175, 55, 0.4); box-shadow: 0 0 30px rgba(212, 175, 55, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-garfield-black/90 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3"><div class="bg-amber-400 p-2.5 rounded-2xl text-black font-extrabold text-2xl">👑</div><span class="font-bangers text-2xl text-white">GARFIELD <span class="gold-gradient-text">10,000+ HOOKS</span></span></a>
            <nav class="hidden lg:flex items-center gap-6 text-xs font-bold uppercase tracking-wider text-slate-300">
                <a href="index.html" class="hover:text-amber-400">Home</a>
                <a href="sandbox.html" class="hover:text-amber-400">Live Sandbox</a>
                <a href="hooks.html" class="text-amber-400">10,000+ Hooks</a>
                <a href="roi.html" class="hover:text-amber-400">ROI</a>
                <a href="pricing.html" class="hover:text-amber-400">Pricing</a>
            </nav>
        </div>
    </header>
    <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-12 flex flex-col gap-8">
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 border-b border-white/10 pb-6">
            <div><span class="text-xs font-extrabold text-amber-400 uppercase tracking-widest">Enterprise Conversational Mastery</span><h1 class="text-3xl font-black text-white mt-1">Clickable 10,000+ Hook Library</h1><p class="text-slate-400 text-sm mt-1">Click any hook card below to instantly trigger simulation in the Sandbox.</p></div>
            <select id="hookCategorySelect" onchange="filterHooks()" class="bg-black/60 border border-white/15 text-white text-xs font-bold px-4 py-3 rounded-xl focus:border-amber-400 cursor-pointer">
                <option value="all">All Sectors (10,000+ Hooks)</option>
                <option value="wealth">Private Wealth & Escrow</option>
                <option value="luxury">Luxury Jet & Automotive</option>
                <option value="medical">Concierge Medical</option>
                <option value="csuite">C-Suite Executive Direct</option>
            </select>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="hookDisplayGrid"></div>
    </main>
    <footer class="bg-black border-t border-white/10 mt-20 py-8 text-center text-xs text-slate-500">© 2026 Garfield Enterprise Inc. All rights reserved.</footer>
    <script>
        const hookCategories = {
            wealth: [
                { hook: "Direct Escrow Routing (> $500K)", pattern: "Detects escrow transfer -> Direct bridge to Managing Director", category: "Private Wealth" },
                { hook: "Portfolio Security Verification", pattern: "Multi-factor Voice Biometric Qualification", category: "Private Wealth" }
            ],
            luxury: [
                { hook: "Gulfstream Flight Charter Priority", pattern: "Matches tail number request -> Instant Flight Dispatch", category: "Luxury Travel" },
                { hook: "Superyacht Berth Reservation", pattern: "Correlates arrival time with harbour master API", category: "Luxury Travel" }
            ],
            medical: [
                { hook: "Emergency Surgical Suite Reservation", pattern: "Direct patch to chief medical officer on call", category: "Concierge Medical" }
            ],
            csuite: [
                { hook: "Series C M&A Board Bridge", pattern: "Bypasses IVR -> Direct bridge to Managing Partner", category: "C-Suite Direct" }
            ]
        };
        function renderHooks(category = 'all') {
            const grid = document.getElementById('hookDisplayGrid');
            let items = [];
            if (category === 'all') Object.values(hookCategories).forEach(arr => items.push(...arr));
            else items = hookCategories[category] || [];
            let html = "";
            items.forEach((h, idx) => {
                html += `<div onclick="window.location.href='sandbox.html'" class="bg-[#121216] p-6 rounded-2xl border border-white/10 hover:border-amber-400 hover:scale-[1.02] transition-all cursor-pointer shadow-lg flex flex-col justify-between gap-4"><div><div class="flex justify-between text-[10px] font-mono"><span class="bg-amber-400/20 text-amber-300 px-2 py-0.5 rounded border border-amber-400/30">HOOK #${idx + 1}</span><span class="text-slate-400">${h.category}</span></div><h3 class="font-bold text-white text-base mt-3">${h.hook}</h3><p class="text-xs font-mono text-slate-400 mt-1">${h.pattern}</p></div><div class="text-[10px] text-amber-400 font-mono pt-2 border-t border-white/10 flex justify-between"><span><i class="fa-solid fa-hand-pointer"></i> Click To Test in Sandbox</span><span class="text-emerald-400">&lt; 150ms</span></div></div>`;
            });
            grid.innerHTML = html;
        }
        function filterHooks() { renderHooks(document.getElementById('hookCategorySelect').value); }
        renderHooks();
    </script>
</body>
</html>
