<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Your AI Receptionist - Onboarding</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); width: 100%; max-width: 550px; }
    h2 { margin-top: 0; color: #111; font-size: 24px; }
    p { color: #666; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, textarea, select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    button { background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; width: 100%; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    #result { margin-top: 24px; background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; display: none; }
    #embedCodeOutput { font-family: monospace; font-size: 12px; background: #fff; color: #0f172a; }
  </style>
</head>
<body>

<div class="container">
  <h2>🚀 Setup Your AI Receptionist</h2>
  <p>Fill in your business details below. Our system will instantly provision your custom AI voice assistant.</p>
  
  <label>Business Name</label>
  <input type="text" id="storeName" placeholder="e.g. Acme Coffee & Bakery">

  <label>Business Details & FAQs</label>
  <textarea id="businessDescription" rows="4" placeholder="e.g. Open daily from 9am to 8pm. Specialty is artisan coffee and fresh croissants. Located at 123 Main Street..."></textarea>

  <label>Primary Language</label>
  <select id="language">
    <option value="en">English</option>
    <option value="es">Spanish (Español)</option>
    <option value="ja">Japanese (日本語)</option>
    <option value="zh">Traditional Chinese (繁體中文)</option>
  </select>

  <label>Account Email</label>
  <input type="email" id="contactEmail" placeholder="owner@business.com">

  <button id="submitBtn" onclick="createTenant()">Generate My AI Assistant</button>

  <div id="result">
    <h3>🎉 Setup Complete!</h3>
    <p>Copy and paste this script tag right before the closing <code>&lt;/body&gt;</code> tag of your website:</p>
    <textarea id="embedCodeOutput" rows="3" readonly></textarea>
  </div>
</div>

<script>
  async function createTenant() {
    const storeName = document.getElementById('storeName').value.trim();
    const businessDescription = document.getElementById('businessDescription').value.trim();
    const language = document.getElementById('language').value;
    const contactEmail = document.getElementById('contactEmail').value.trim();
    const btn = document.getElementById('submitBtn');

    if (!storeName || !businessDescription || !contactEmail) {
      alert('Please fill in all required fields.');
      return;
    }

    btn.innerText = 'Provisioning AI Assistant...';
    btn.disabled = true;

    try {
      const response = await fetch('/api/create-tenant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ storeName, businessDescription, language, contactEmail })
      });

      const result = await response.json();

      if (response.ok && result.success) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('embedCodeOutput').value = result.data.embedCode;
        btn.innerText = 'Assistant Ready!';
      } else {
        throw new Error(result.error || 'Failed to provision assistant.');
      }
    } catch (err) {
      alert('Error: ' + err.message);
      btn.innerText = 'Generate My AI Assistant';
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
