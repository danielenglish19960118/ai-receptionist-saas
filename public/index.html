<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Receptionist | B2B SaaS Management Portal</title>
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: #111827;
      --border-color: #1f2937;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #9ca3af;
      --error: #ef4444;
      --success: #10b981;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Auth Overlay */
    #auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }

    .auth-card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 380px;
      box-sizing: border-box;
      text-align: center;
    }

    .auth-icon {
      width: 50px;
      height: 50px;
      background: rgba(59, 130, 246, 0.1);
      color: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 24px;
    }

    .auth-card h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 600;
    }

    .auth-card p {
      margin: 0 0 24px 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Main App Container */
    .main-container {
      max-width: 650px;
      margin: 50px auto;
      padding: 40px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 { margin-top: 0; font-size: 24px; font-weight: 600; }
    p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--primary);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .error-msg {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    /* Result Box */
    #result-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 8px;
      background: #1f2937;
      border: 1px solid #374151;
      display: none;
    }

    #result-box.success {
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.05);
    }

    .result-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 8px;
      color: var(--success);
    }

    .result-content {
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- ================= Enterprise Security Password Overlay ================= -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div class="auth-icon">🔒</div>
      <h2>Access Verification</h2>
      <p>This is a private B2B SaaS platform. Please enter your secure access key to continue.</p>
      
      <input type="password" id="access-password" class="form-input" placeholder="Enter secure access key..." style="margin-bottom: 16px;">
      <button id="login-btn" class="btn-primary" onclick="verifyPassword()" style="margin-top: 0;">Verify & Enter</button>
      <p id="auth-error" class="error-msg"></p>
    </div>
  </div>

  <!-- ================= Main SaaS Application Interface ================= -->
  <div class="main-container">
    <h1>🤖 AI Voice Receptionist</h1>
    <p class="subtitle">Client Tenant Provisioning Portal — Automatically deploy a dedicated Vapi AI assistant for overseas businesses.</p>
    
    <form id="tenant-form" onsubmit="createTenant(event)">
      <div class="form-group">
        <label class="form-label">Client / Business Name</label>
        <input type="text" id="business-name" class="form-input" placeholder="e.g., Austin Dental Clinic" required>
      </div>

      <div class="form-group">
        <label class="form-label">Business Type / Industry</label>
        <input type="text" id="business-type" class="form-input" placeholder="e.g., Healthcare / Dental Services" required>
      </div>

      <div class="form-group">
        <label class="form-label">Initial Greeting / Prompt Instructions</label>
        <textarea id="prompt-instructions" class="form-textarea" placeholder="Describe how the AI receptionist should greet callers and handle inquiries..." required>Hello! Thank you for calling. How can I assist you with our services today?</textarea>
      </div>

      <button type="submit" id="submit-btn" class="btn-primary">Deploy AI Receptionist Assistant</button>
      <p id="form-error" class="error-msg"></p>
    </form>

    <!-- Success / Result Display -->
    <div id="result-box">
      <div class="result-title">✨ Tenant Provisioned Successfully!</div>
      <div id="result-details" class="result-content"></div>
    </div>
  </div>

  <script>
    // 1. Check session verification status on load
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('saas_auth_token') === 'verified') {
        document.getElementById('auth-overlay').style.display = 'none';
      }
    });

    // 2. Password Verification Handler
    async function verifyPassword() {
      const passwordInput = document.getElementById('access-password');
      const loginBtn = document.getElementById('login-btn');
      const errorMsg = document.getElementById('auth-error');
      const password = passwordInput.value.trim();

      if (!password) {
        errorMsg.textContent = 'Please enter your access key';
        errorMsg.style.display = 'block';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Verifying...';
      errorMsg.style.display = 'none';

      try {
        const response = await fetch('/api/verify-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (data.success) {
          sessionStorage.setItem('saas_auth_token', 'verified');
          document.getElementById('auth-overlay').style.display = 'none';
        } else {
          errorMsg.textContent = data.message || 'Incorrect key, please try again.';
          errorMsg.style.display = 'block';
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        errorMsg.textContent = 'Network connection error. Please try again later.';
        errorMsg.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Verify & Enter';
      }
    }

    document.getElementById('access-password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verifyPassword();
    });

    // 3. Tenant Creation Form Handler (Calls api/create-tenant.js)
    async function createTenant(event) {
      event.preventDefault();

      const businessName = document.getElementById('business-name').value.trim();
      const businessType = document.getElementById('business-type').value.trim();
      const promptInstructions = document.getElementById('prompt-instructions').value.trim();
      const submitBtn = document.getElementById('submit-btn');
      const formError = document.getElementById('form-error');
      const resultBox = document.getElementById('result-box');
      const resultDetails = document.getElementById('result-details');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Deploying Assistant...';
      formError.style.display = 'none';
      resultBox.style.display = 'none';

      try {
        const response = await fetch('/api/create-tenant', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            businessName,
            businessType,
            promptInstructions
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          resultBox.className = 'success';
          resultDetails.innerHTML = `
            <strong>Assistant ID:</strong> ${data.assistantId || 'Created'}<br>
            <strong>Business:</strong> ${businessName}<br>
            <strong>Status:</strong> Live & Ready for Callers
          `;
          resultBox.style.display = 'block';
          document.getElementById('tenant-form').reset();
        } else {
          formError.textContent = data.message || 'Failed to deploy assistant. Please check your API keys.';
          formError.style.display = 'block';
        }
      } catch (err) {
        formError.textContent = 'Network error while connecting to deployment server.';
        formError.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Deploy AI Receptionist Assistant';
      }
    }
  </script>
</body>
</html>
