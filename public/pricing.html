<body class="min-h-screen flex flex-col">

            <div class="flex items-center gap-5"><div class="w-14 h-14 rounded-2xl bg-amber-400/25 text-amber-300 flex items-center justify-center text-3xl font-bold">🔐</div><div><h3 class="text-xl font-bold text-white">Enter VIP License Key</h3><p class="text-xs text-slate-400 mt-1">Use demo keys <code class="text-amber-300 font-mono">garfield</code> or <code class="text-amber-300 font-mono">lasagna</code> to unlock provisioning.</p></div></div>

    <script>
        function validateKey() {
            const key = document.getElementById('securityPassInput').value.trim();
            if (key === 'garfield' || key === 'lasagna' || key.length >= 8) alert("VIP License Verified Successfully!");
            else alert("Invalid Key. Use demo keys 'garfield' or 'lasagna'.");
